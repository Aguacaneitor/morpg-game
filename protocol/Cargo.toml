[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

# The wire format: the messages and how they're encoded (src/lib.rs).
# No renderer, window or network code -- the messages carry game_core's
# ids and components, which brings in bevy_ecs and bevy_math, nothing
# more.
[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
bevy_math = "0.13"
game_core = { path = "../core" }
