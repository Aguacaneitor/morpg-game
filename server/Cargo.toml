[package]
name = "game_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Loads a `.env` file (if present) into the process environment before
# anything reads `std::env::var` -- e.g. `ARPG_GROQ_API_KEY`. Nothing in
# this project read `.env` files at all before `npc_dialogue` needed a
# real secret; every other `ARPG_*` var still works exactly as before
# whether it comes from `.env`, the shell, or neither (falls back to its
# own default). `.env` itself is already gitignored.
dotenvy = "0.15"
# default-features = false is what makes this genuinely headless:
# no window, no renderer, no audio, no asset pipeline get compiled in.
# MinimalPlugins (schedule runner + task pools + Time) still works fine.
bevy = { version = "0.13", default-features = false }
game_core = { path = "../core" }
protocol = { path = "../protocol" }
bincode = "1.3"
# Picking random non-solid tiles for zone-declared creature spawns.
rand = "0.8"
# Only transitive through game_core/protocol otherwise -- persistence.rs
# defines its own Serialize/Deserialize struct (CharacterSave), which
# needs the derive macro directly available to this crate.
serde = { version = "1", features = ["derive"] }
# Human-readable save format (server::persistence's CharacterSave blob) --
# same reasoning as every other RON file in this project: readable/
# debuggable while the saved shape is still actively changing. `bincode`
# is already a dependency but is opaque binary, not worth it for this.
ron = "0.8"
# `bundled` compiles SQLite from source -- no system SQLite install
# required, keeping this a "clone and cargo run" project.
rusqlite = { version = "0.31", features = ["bundled"] }

# Phase 4: validating a client's session token against `auth_server` on
# connect (plain HTTP, a local service). `server::npc_dialogue` reuses
# the same crate for the real, external Groq API call, which needs the
# `tls` feature (rustls -- pure Rust, no system OpenSSL install required,
# matching this project's own "bundled, no system deps" preference
# elsewhere) plus `native-certs`: `tls` alone trusts only `webpki-roots`'
# hardcoded public-CA bundle, which failed outright (`UnknownIssuer`)
# against Groq's real API on this machine -- likely a corporate TLS-
# inspecting proxy/antivirus product presenting its own root certificate,
# the way `curl` (which reads the Windows certificate store) already
# trusted it but a fixed public-CA-only list never could. `native-certs`
# swaps in `rustls-native-certs`, which reads the OS's own trust store
# instead, matching `curl`'s own behavior exactly. Both call sites run
# ONLY from a worker thread (`character_select::validate_token` /
# `npc_dialogue::call_groq`), never inline in a tick, keeping the
# server's no-async-runtime design intact regardless of how slow either
# HTTP round-trip is.
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }
serde_json = "1"

# renet 0.0.15 / bevy_renet 0.0.11 is the last pair that targets Bevy 0.13
# -- bevy_renet 0.0.12 jumps straight to Bevy 0.14. Pin exactly here so a
# routine `cargo update` doesn't silently try to drag in an incompatible
# major version.
renet = { version = "=0.0.15", default-features = false, features = ["transport"] }
bevy_renet = { version = "=0.0.11", default-features = false, features = ["transport"] }
