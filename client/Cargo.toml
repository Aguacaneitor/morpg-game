[package]
name = "game_client"
version = "0.1.0"
edition = "2021"

[dependencies]
# "serialize" enables Serialize/Deserialize on input types like KeyCode
# -- needed so config/input.ron can name keys directly (e.g. `KeyW`)
# instead of a hand-rolled string-to-KeyCode translation layer.
# "mp3" enables MP3 decoding -- not on by default (only Vorbis/OGG is);
# see client::animation's own doc for the animation-locked sound cues
# that need it.
bevy = { version = "0.13", features = ["serialize", "mp3", "jpeg"] }
game_core = { path = "../core" }
protocol = { path = "../protocol" }
bincode = "1.3"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
# Sprite metadata.json (PixelLab's own export format, not this project's
# convention) is JSON, unlike every other config file here -- see
# animation.rs's `SpriteMetadata`.
serde_json = "1"
# Picking a random sound variant when an animation has more than one --
# see client::animation's own doc.
rand = "0.8"

# See server/Cargo.toml for why this exact pair is pinned.
renet = { version = "=0.0.15", default-features = false, features = ["transport"] }
bevy_renet = { version = "=0.0.11", default-features = false, features = ["transport"] }

# Blocking HTTP for the Phase 3 login screen's calls to `auth_server`
# (/register, /login). `default-features = false` drops ureq's rustls/TLS
# default -- Phase 3 talks plain HTTP to a localhost auth service; Phase 5
# turns the TLS feature back on. Runs on a std::thread (this crate has no
# async runtime), result polled back over an mpsc channel -- see
# `client::login_ui`. `json` reuses the serde_json already pulled in above.
ureq = { version = "2", default-features = false, features = ["json"] }
